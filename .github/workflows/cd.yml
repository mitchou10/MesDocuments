name: CD

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

# Releases must never overlap: two pushes landing close together would run two
# release jobs against the same branch, and the loser fails on the tag the
# winner already created ("Duplicate release tag"). Queue instead of cancel -
# aborting a release midway is worse than making it wait.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILD_AMD64: true
  BUILD_ARM64: false
  LATEST_TAG: ${{ github.ref_name == 'main' }}
  USE_QEMU: false
  TAG_MAJOR_AND_MINOR: false
  # Matches ci.yml: this repository has no use for a per-commit SHA tag on
  # any of its images, release builds included.
  TAG_SHORT_SHA: false
  # Automerge needs a GitHub App or a PAT; this repository authenticates with
  # GITHUB_TOKEN alone, so release-please's pull request is merged by hand.
  # Turning either of these on without a credential fails the job by design.
  AUTOMERGE_PRERELEASE: false
  AUTOMERGE_RELEASE: false
  PRERELEASE_BRANCH: dev
  RELEASE_BRANCH: main
  # apps/backend and apps/frontend version independently (feat(backend)/
  # feat(frontend) each bump only their own package), so each gets its own
  # config/manifest pair. release-please-action only republishes its plain
  # (un-prefixed) `version`/`release_created`/`tag_name` outputs - the ones
  # the reusable release-app.yml wrapper exposes - when a manifest resolves
  # to exactly ONE package. Splitting the files is what keeps that true,
  # without having to fork or reimplement that wrapper (GitHub App auth,
  # draft-release publishing, major/minor tagging, fork-PR-safe prerelease
  # sync all live there and stay untouched this way).
  RELEASE_CONFIG_FILE_BACKEND: .github/releases/release-please-config-release-backend.json
  RELEASE_MANIFEST_FILE_BACKEND: .github/releases/.release-please-manifest-backend.json
  PRERELEASE_CONFIG_FILE_BACKEND: .github/releases/release-please-config-prerelease-backend.json
  PRERELEASE_MANIFEST_FILE_BACKEND: .github/releases/.release-please-manifest-prerelease-backend.json
  RELEASE_CONFIG_FILE_FRONTEND: .github/releases/release-please-config-release-frontend.json
  RELEASE_MANIFEST_FILE_FRONTEND: .github/releases/.release-please-manifest-frontend.json
  PRERELEASE_CONFIG_FILE_FRONTEND: .github/releases/release-please-config-prerelease-frontend.json
  PRERELEASE_MANIFEST_FILE_FRONTEND: .github/releases/.release-please-manifest-prerelease-frontend.json
  ENABLE_PRERELEASE: true
  # The chart lives at the repository root as `helm/`; CHART_NAME is the
  # directory under CHARTS_DIR, while the published OCI artifact is named from
  # Chart.yaml (`MesDocuments`) - so it stays ghcr.io/<repo>/MesDocuments regardless.
  CHARTS_DIR: ./
  CHART_NAME: helm
  # Only the plain-HTTP dependency needs declaring; the cloudpirates charts are
  # pulled straight from their OCI registry.
  HELM_REPOS: cnpg=https://cloudnative-pg.github.io/charts

jobs:
  expose-vars:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      BUILD_AMD64: ${{ env.BUILD_AMD64 }}
      BUILD_ARM64: ${{ env.BUILD_ARM64 }}
      LATEST_TAG: ${{ env.LATEST_TAG }}
      USE_QEMU: ${{ env.USE_QEMU }}
      TAG_MAJOR_AND_MINOR: ${{ env.TAG_MAJOR_AND_MINOR }}
      TAG_SHORT_SHA: ${{ env.TAG_SHORT_SHA }}
      AUTOMERGE_PRERELEASE: ${{ env.AUTOMERGE_PRERELEASE }}
      AUTOMERGE_RELEASE: ${{ env.AUTOMERGE_RELEASE }}
      PRERELEASE_BRANCH: ${{ env.PRERELEASE_BRANCH }}
      RELEASE_BRANCH: ${{ env.RELEASE_BRANCH }}
      RELEASE_CONFIG_FILE_BACKEND: ${{ env.RELEASE_CONFIG_FILE_BACKEND }}
      RELEASE_MANIFEST_FILE_BACKEND: ${{ env.RELEASE_MANIFEST_FILE_BACKEND }}
      PRERELEASE_CONFIG_FILE_BACKEND: ${{ env.PRERELEASE_CONFIG_FILE_BACKEND }}
      PRERELEASE_MANIFEST_FILE_BACKEND: ${{ env.PRERELEASE_MANIFEST_FILE_BACKEND }}
      RELEASE_CONFIG_FILE_FRONTEND: ${{ env.RELEASE_CONFIG_FILE_FRONTEND }}
      RELEASE_MANIFEST_FILE_FRONTEND: ${{ env.RELEASE_MANIFEST_FILE_FRONTEND }}
      PRERELEASE_CONFIG_FILE_FRONTEND: ${{ env.PRERELEASE_CONFIG_FILE_FRONTEND }}
      PRERELEASE_MANIFEST_FILE_FRONTEND: ${{ env.PRERELEASE_MANIFEST_FILE_FRONTEND }}
      ENABLE_PRERELEASE: ${{ env.ENABLE_PRERELEASE }}
      CHARTS_DIR: ${{ env.CHARTS_DIR }}
      CHART_NAME: ${{ env.CHART_NAME }}
      HELM_REPOS: ${{ env.HELM_REPOS }}
      IMAGE_BASE: ${{ steps.image-base.outputs.IMAGE_BASE }}
    steps:
      - name: Exposing env vars
        run: echo "Exposing env vars"

      - name: Compute image base
        id: image-base
        shell: bash
        # `IA-Generative` is mixed case and OCI registries reject uppercase
        # references. See the matching note in ci.yml.
        run: echo "IMAGE_BASE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  release-backend:
    uses: dnum-mi/fabnum-cicd/.github/workflows/release-app.yml@v0
    needs:
      - expose-vars
    permissions:
      issues: write
      pull-requests: write
      contents: write
    with:
      TAG_MAJOR_AND_MINOR: ${{ needs.expose-vars.outputs.TAG_MAJOR_AND_MINOR == 'true' }}
      AUTOMERGE_PRERELEASE: ${{ needs.expose-vars.outputs.AUTOMERGE_PRERELEASE == 'true' }}
      AUTOMERGE_RELEASE: ${{ needs.expose-vars.outputs.AUTOMERGE_RELEASE == 'true' }}
      PRERELEASE_BRANCH: ${{ needs.expose-vars.outputs.PRERELEASE_BRANCH }}
      RELEASE_BRANCH: ${{ needs.expose-vars.outputs.RELEASE_BRANCH }}
      RELEASE_CONFIG_FILE: ${{ needs.expose-vars.outputs.RELEASE_CONFIG_FILE_BACKEND }}
      RELEASE_MANIFEST_FILE: ${{ needs.expose-vars.outputs.RELEASE_MANIFEST_FILE_BACKEND }}
      PRERELEASE_CONFIG_FILE: ${{ needs.expose-vars.outputs.PRERELEASE_CONFIG_FILE_BACKEND }}
      PRERELEASE_MANIFEST_FILE: ${{ needs.expose-vars.outputs.PRERELEASE_MANIFEST_FILE_BACKEND }}
      ENABLE_PRERELEASE: ${{ needs.expose-vars.outputs.ENABLE_PRERELEASE == 'true' }}
    # App token: release-please then pushes its release pull request as the
    # App instead of GITHUB_TOKEN, so that pull request finally triggers
    # ci.yml's `pull_request` checks instead of landing with no CI - it is
    # still merged by hand (AUTOMERGE_* above stay false; this only changes
    # who authenticates the push, not whether anything auto-merges). Same for
    # the manifest-sync step on dev: it can now push an amended commit that
    # re-triggers checks too, instead of the GITHUB_TOKEN path's checks never
    # re-running on that commit.
    # No loop risk from this, unlike bump-chart: every push this credential
    # makes here targets release-please's own pull request branch, never
    # dev/main directly - see the checkout step in release-app.yml, which
    # stays on GITHUB_TOKEN regardless and is what actually pushes tags and
    # cuts the release.
    secrets:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  release-frontend:
    uses: dnum-mi/fabnum-cicd/.github/workflows/release-app.yml@v0
    needs:
      - expose-vars
    permissions:
      issues: write
      pull-requests: write
      contents: write
    with:
      TAG_MAJOR_AND_MINOR: ${{ needs.expose-vars.outputs.TAG_MAJOR_AND_MINOR == 'true' }}
      AUTOMERGE_PRERELEASE: ${{ needs.expose-vars.outputs.AUTOMERGE_PRERELEASE == 'true' }}
      AUTOMERGE_RELEASE: ${{ needs.expose-vars.outputs.AUTOMERGE_RELEASE == 'true' }}
      PRERELEASE_BRANCH: ${{ needs.expose-vars.outputs.PRERELEASE_BRANCH }}
      RELEASE_BRANCH: ${{ needs.expose-vars.outputs.RELEASE_BRANCH }}
      RELEASE_CONFIG_FILE: ${{ needs.expose-vars.outputs.RELEASE_CONFIG_FILE_FRONTEND }}
      RELEASE_MANIFEST_FILE: ${{ needs.expose-vars.outputs.RELEASE_MANIFEST_FILE_FRONTEND }}
      PRERELEASE_CONFIG_FILE: ${{ needs.expose-vars.outputs.PRERELEASE_CONFIG_FILE_FRONTEND }}
      PRERELEASE_MANIFEST_FILE: ${{ needs.expose-vars.outputs.PRERELEASE_MANIFEST_FILE_FRONTEND }}
      ENABLE_PRERELEASE: ${{ needs.expose-vars.outputs.ENABLE_PRERELEASE == 'true' }}
    secrets:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  build-docker-backend:
    uses: dnum-mi/fabnum-cicd/.github/workflows/build-docker.yml@v0
    needs:
      - expose-vars
      - release-backend
    if: ${{ needs.release-backend.outputs.release-created == 'true' }}
    permissions:
      packages: write
      contents: read
    with:
      IMAGE_NAME: ${{ needs.expose-vars.outputs.IMAGE_BASE }}/api
      IMAGE_TAG: ${{ needs.release-backend.outputs.version }}
      IMAGE_CONTEXT: apps/backend
      IMAGE_DOCKERFILE: apps/backend/Dockerfile
      IMAGE_TARGET: production
      BUILD_AMD64: ${{ needs.expose-vars.outputs.BUILD_AMD64 == 'true' }}
      BUILD_ARM64: ${{ needs.expose-vars.outputs.BUILD_ARM64 == 'true' }}
      LATEST_TAG: ${{ needs.expose-vars.outputs.LATEST_TAG == 'true' }}
      USE_QEMU: ${{ needs.expose-vars.outputs.USE_QEMU == 'true' }}
      TAG_MAJOR_AND_MINOR: ${{ needs.expose-vars.outputs.TAG_MAJOR_AND_MINOR == 'true' && needs.expose-vars.outputs.LATEST_TAG == 'true' }}
      TAG_SHORT_SHA: ${{ needs.expose-vars.outputs.TAG_SHORT_SHA == 'true' }}
      CACHE: true
      CACHE_MODE: min
      BUILD_ARGS: |
        APP_VERSION=${{ needs.release-backend.outputs.version }}
    # See the matching note in ci.yml: ghcr.io is authenticated with the job's
    # own GITHUB_TOKEN, so there is no secret to pass.

  build-docker-frontend:
    uses: dnum-mi/fabnum-cicd/.github/workflows/build-docker.yml@v0
    needs:
      - expose-vars
      - release-frontend
    if: ${{ needs.release-frontend.outputs.release-created == 'true' }}
    permissions:
      packages: write
      contents: read
    with:
      IMAGE_NAME: ${{ needs.expose-vars.outputs.IMAGE_BASE }}/frontend
      IMAGE_TAG: ${{ needs.release-frontend.outputs.version }}
      IMAGE_CONTEXT: apps/frontend
      IMAGE_DOCKERFILE: apps/frontend/Dockerfile
      IMAGE_TARGET: production
      BUILD_AMD64: ${{ needs.expose-vars.outputs.BUILD_AMD64 == 'true' }}
      BUILD_ARM64: ${{ needs.expose-vars.outputs.BUILD_ARM64 == 'true' }}
      LATEST_TAG: ${{ needs.expose-vars.outputs.LATEST_TAG == 'true' }}
      USE_QEMU: ${{ needs.expose-vars.outputs.USE_QEMU == 'true' }}
      TAG_MAJOR_AND_MINOR: ${{ needs.expose-vars.outputs.TAG_MAJOR_AND_MINOR == 'true' && needs.expose-vars.outputs.LATEST_TAG == 'true' }}
      TAG_SHORT_SHA: ${{ needs.expose-vars.outputs.TAG_SHORT_SHA == 'true' }}
      CACHE: true
      CACHE_MODE: min
      BUILD_ARGS: |
        APP_VERSION=${{ needs.release-frontend.outputs.version }}

  # --- Ce qui suit (chart Helm, sync CPiN, sync de la branche de prérelease) ---
  # reste construit autour d'UNE seule version d'application (un seul chart
  # "MesDocuments" au niveau du repo). Avec deux releases indépendantes, il n'y
  # a plus de version unique évidente à lui passer : ce qui suit est un choix
  # provisoire (préférer la version backend si les deux sortent le même run,
  # sinon celle qui a effectivement été créée) et non une décision définitive -
  # à retravailler selon la façon dont values.yaml référence les tags d'image.
  bump-chart:
    uses: dnum-mi/fabnum-cicd/.github/workflows/update-helm-chart.yml@v0
    needs:
      - expose-vars
      - release-backend
      - release-frontend
      - build-docker-backend
      - build-docker-frontend
    if: |
      always() &&
      (needs.release-backend.outputs.release-created == 'true' || needs.release-frontend.outputs.release-created == 'true') &&
      needs.build-docker-backend.result != 'failure' && needs.build-docker-frontend.result != 'failure'
    permissions:
      contents: write
      pull-requests: write
    with:
      # Monorepo: the chart ships with the code, so the bump is committed
      # straight onto the branch instead of arriving as a pull request.
      RUN_MODE: local
      CHART_DIR: ${{ needs.expose-vars.outputs.CHARTS_DIR }}
      CHART_NAME: ${{ needs.expose-vars.outputs.CHART_NAME }}
      # UPGRADE_TYPE defaults to 'auto': level from the appVersion delta, rc
      # cycle vs release selected by the shape of APP_VERSION. The chart keeps
      # its own version line - a 0.19.12 app can ship as chart 0.1.1.
      APP_VERSION: ${{ needs.release-backend.outputs.release-created == 'true' && needs.release-backend.outputs.version || needs.release-frontend.outputs.version }}
    secrets:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  sync-cpin:
    name: Sync CPiN after release
    uses: dnum-mi/fabnum-cicd/.github/workflows/sync-cpin.yml@v0
    needs:
      - release-backend
      - release-frontend
      - bump-chart
    if: ${{ needs.release-backend.outputs.release-created == 'true' || needs.release-frontend.outputs.release-created == 'true' }}
    # The only automatic CPiN sync left: dso-auto-sync.yaml is manual-only
    # (see that file) precisely because this job already covers every push
    # that matters - and does so correctly, since it only fires once
    # bump-chart has actually landed the version bump, instead of racing it
    # the way a plain per-push trigger would.
    permissions: {}
    with:
      GITLAB_URL: ${{ vars.GITLAB_URL }}
      GIT_MIRROR_PROJECT_ID: ${{ vars.GITLAB_MIRROR_ID }}
      REPOSITORY_NAME: ${{ vars.GILTAB_PROJECT_NAME }}
      BRANCH_TO_SYNC: ${{ github.ref_name }}
      SYNC_ALL: false
    secrets:
      GIT_MIRROR_TOKEN: ${{ secrets.GITLAB_TRIGGER_TOKEN }}

  release-chart:
    uses: dnum-mi/fabnum-cicd/.github/workflows/release-helm-local.yml@v0
    needs:
      - expose-vars
      - release-backend
      - release-frontend
      - build-docker-backend
      - build-docker-frontend
      - bump-chart
    if: ${{ needs.release-backend.outputs.release-created == 'true' || needs.release-frontend.outputs.release-created == 'true' }}
    permissions:
      contents: read
      packages: write
    with:
      # Monorepo: the chart shares the app's tag namespace, so chart-releaser's
      # tag-based change detection is unreliable - package the exact commit
      # bump-chart just pushed instead.
      CHARTS_DIR: ${{ needs.expose-vars.outputs.CHARTS_DIR }}
      CHART_NAME: ${{ needs.expose-vars.outputs.CHART_NAME }}
      CHECKOUT_REF: ${{ needs.bump-chart.outputs.commit-sha }}
      HELM_REPOS: ${{ needs.expose-vars.outputs.HELM_REPOS }}

  # Last on purpose. A release lands commits on main that dev does not have -
  # release-please's release commit, and bump-chart's chart bump - and dev
  # edits those same files on its own rc cycle. Left unsynchronised it computes
  # its next versions from a pre-release state and conflicts with main on the
  # following promotion.
  #
  # `needs:` lists exactly the jobs that COMMIT to main - both release jobs and
  # bump-chart - and nothing else. build-docker and release-chart commit
  # nothing, and listing them would only let a failed build or a failed publish
  # skip the sync, leaving dev stale for no reason. Ordering still holds:
  # bump-chart already needs the build-docker jobs.
  #
  # release-app.yml asserts the result on the next dev run, so a missing entry
  # here fails loudly there rather than silently producing a version below what
  # main published.
  sync-prerelease-branch:
    uses: dnum-mi/fabnum-cicd/.github/workflows/sync-prerelease-branch.yml@v0
    needs:
      - expose-vars
      - release-backend
      - release-frontend
      - bump-chart
    if: |
      github.ref_name == needs.expose-vars.outputs.RELEASE_BRANCH &&
      (needs.release-backend.outputs.release-created == 'true' || needs.release-frontend.outputs.release-created == 'true')
    permissions:
      contents: write
    with:
      RELEASE_BRANCH: ${{ needs.expose-vars.outputs.RELEASE_BRANCH }}
      PRERELEASE_BRANCH: ${{ needs.expose-vars.outputs.PRERELEASE_BRANCH }}
