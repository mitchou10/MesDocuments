name: Unit Tests

# Kept local rather than delegated to fabnum-cicd: every target here drives
# `docker compose` against postgres/redis/minio through the repository's
# Makefile. `test-docker.yml` runs a command in a single image and cannot
# stand these up.

on:
  workflow_call:
    inputs:
      PYTHON_VERSION:
        description: Python version used to run tests
        required: false
        type: string
        default: "3.13"
  workflow_dispatch:
    inputs:
      PYTHON_VERSION:
        description: Python version used to run tests
        required: false
        type: string
        default: "3.13"

jobs:
  run-tests-backend:
    name: Backend API
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # docker-compose-test.yaml interpolates these into the MesDocuments_backend service; CI has no
    # .env.local supplying real values, so an unset default here just quiets Compose's
    # "variable is not set" warning without changing what the container actually gets.
    env:
      HARBOR_PROXY_URL: ""
      OPENAI_BASE_URL: ""
      VISION_MODEL: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ inputs.PYTHON_VERSION }}

      - name: Install dependencies and run tests
        run: make test-backend

      - name: Tear down containers
        if: ${{ always() }}
        # `make test-*` already calls `make down-test` on success; this catches
        # the failure path, so a failed run still exits with the compose stack
        # stopped instead of leaking it to the runner's teardown.
        run: make down-test

  run-tests-worker:
    name: MesDocuments worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # See run-tests-backend above: same docker-compose-test.yaml, same unset-variable noise.
    env:
      HARBOR_PROXY_URL: ""
      OPENAI_BASE_URL: ""
      VISION_MODEL: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ inputs.PYTHON_VERSION }}

      - name: Install dependencies and run tests
        run: make test-worker

      - name: Tear down containers
        if: ${{ always() }}
        run: make down-test
